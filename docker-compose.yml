name: resto

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-5}

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

x-app-environment: &app-environment
  DJANGO_ENV: ${DJANGO_ENV:?DJANGO_ENV is required}
  DJANGO_DEBUG: ${DJANGO_DEBUG:?DJANGO_DEBUG is required}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  TABLE_QR_TOKEN_ENCRYPTION_KEY: ${TABLE_QR_TOKEN_ENCRYPTION_KEY:?TABLE_QR_TOKEN_ENCRYPTION_KEY is required}
  TABLE_QR_TOKEN_ENCRYPTION_FALLBACK_KEYS: ${TABLE_QR_TOKEN_ENCRYPTION_FALLBACK_KEYS:-}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_HEALTHCHECK_HOST: ${DJANGO_HEALTHCHECK_HOST:-127.0.0.1}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
  DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-True}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-3600}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
  DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-False}
  DJANGO_REFERRER_POLICY: ${DJANGO_REFERRER_POLICY:-same-origin}
  DJANGO_SECURITY_POLICY_HEADERS_ENABLED: ${DJANGO_SECURITY_POLICY_HEADERS_ENABLED:-True}
  DJANGO_PERMISSIONS_POLICY: "${DJANGO_PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=()}"
  DJANGO_USE_WHITENOISE: ${DJANGO_USE_WHITENOISE:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:?EMAIL_BACKEND is required}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL is required}
  SERVER_EMAIL: ${SERVER_EMAIL:-}
  EMAIL_SUBJECT_PREFIX: "${EMAIL_SUBJECT_PREFIX:-[Caesar & Company] }"
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-True}
  RATE_LIMIT_CACHE_FAILURE_RETRY_AFTER: ${RATE_LIMIT_CACHE_FAILURE_RETRY_AFTER:-5}
  DJANGO_TRUST_PROXY_HEADERS: ${DJANGO_TRUST_PROXY_HEADERS:-True}
  DJANGO_TRUSTED_PROXY_CIDRS: ${DJANGO_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-8}
  RATE_LIMIT_LOGIN_PER_HOUR: ${RATE_LIMIT_LOGIN_PER_HOUR:-40}
  RATE_LIMIT_SIGNUP_PER_MINUTE: ${RATE_LIMIT_SIGNUP_PER_MINUTE:-5}
  RATE_LIMIT_SIGNUP_PER_HOUR: ${RATE_LIMIT_SIGNUP_PER_HOUR:-20}
  RATE_LIMIT_PASSWORD_RESET_PER_MINUTE: ${RATE_LIMIT_PASSWORD_RESET_PER_MINUTE:-3}
  RATE_LIMIT_PASSWORD_RESET_PER_HOUR: ${RATE_LIMIT_PASSWORD_RESET_PER_HOUR:-10}
  RATE_LIMIT_PASSWORD_RESET_CONFIRM_PER_MINUTE: ${RATE_LIMIT_PASSWORD_RESET_CONFIRM_PER_MINUTE:-6}
  RATE_LIMIT_PASSWORD_RESET_CONFIRM_PER_HOUR: ${RATE_LIMIT_PASSWORD_RESET_CONFIRM_PER_HOUR:-30}
  RATE_LIMIT_GOOGLE_LOGIN_PER_MINUTE: ${RATE_LIMIT_GOOGLE_LOGIN_PER_MINUTE:-10}
  RATE_LIMIT_GOOGLE_LOGIN_PER_HOUR: ${RATE_LIMIT_GOOGLE_LOGIN_PER_HOUR:-60}
  RATE_LIMIT_AI_ASK_PER_MINUTE: ${RATE_LIMIT_AI_ASK_PER_MINUTE:-20}
  RATE_LIMIT_AI_ASK_PER_HOUR: ${RATE_LIMIT_AI_ASK_PER_HOUR:-120}
  RATE_LIMIT_QR_MENU_PER_MINUTE: ${RATE_LIMIT_QR_MENU_PER_MINUTE:-30}
  RATE_LIMIT_QR_MENU_PER_HOUR: ${RATE_LIMIT_QR_MENU_PER_HOUR:-300}
  RATE_LIMIT_ORDER_QUOTE_PER_MINUTE: ${RATE_LIMIT_ORDER_QUOTE_PER_MINUTE:-120}
  RATE_LIMIT_ORDER_QUOTE_PER_HOUR: ${RATE_LIMIT_ORDER_QUOTE_PER_HOUR:-1000}
  RATE_LIMIT_ORDER_CREATE_PER_MINUTE: ${RATE_LIMIT_ORDER_CREATE_PER_MINUTE:-20}
  RATE_LIMIT_ORDER_CREATE_PER_HOUR: ${RATE_LIMIT_ORDER_CREATE_PER_HOUR:-100}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
  GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
  SITE_URL: ${SITE_URL:-http://localhost:8000}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  YOOKASSA_MOCK: ${YOOKASSA_MOCK:-False}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-600}
  AI_HISTORY_LIMIT: ${AI_HISTORY_LIMIT:-12}
  AI_MENU_CONTEXT_LIMIT: ${AI_MENU_CONTEXT_LIMIT:-80}
  AI_HISTORY_RETENTION_DAYS: ${AI_HISTORY_RETENTION_DAYS:-180}
  AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-60}
  AI_RATE_LIMIT_IP_PER_MINUTE: ${AI_RATE_LIMIT_IP_PER_MINUTE:-30}
  AI_RATE_LIMIT_GUEST_PER_MINUTE: ${AI_RATE_LIMIT_GUEST_PER_MINUTE:-6}
  AI_RATE_LIMIT_USER_PER_MINUTE: ${AI_RATE_LIMIT_USER_PER_MINUTE:-12}
  AI_DAILY_QUOTA_IP: ${AI_DAILY_QUOTA_IP:-120}
  AI_DAILY_QUOTA_GUEST: ${AI_DAILY_QUOTA_GUEST:-25}
  AI_DAILY_QUOTA_USER: ${AI_DAILY_QUOTA_USER:-80}
  AI_DAILY_TOKEN_BUDGET_IP: ${AI_DAILY_TOKEN_BUDGET_IP:-160000}
  AI_DAILY_TOKEN_BUDGET_GUEST: ${AI_DAILY_TOKEN_BUDGET_GUEST:-30000}
  AI_DAILY_TOKEN_BUDGET_USER: ${AI_DAILY_TOKEN_BUDGET_USER:-100000}
  AI_ESTIMATED_RESPONSE_TOKENS: ${AI_ESTIMATED_RESPONSE_TOKENS:-600}
  AI_ESTIMATED_COST_MICROS_PER_1000_TOKENS: ${AI_ESTIMATED_COST_MICROS_PER_1000_TOKENS:-0}
  AI_DAILY_COST_BUDGET_MICROS_IP: ${AI_DAILY_COST_BUDGET_MICROS_IP:-0}
  AI_DAILY_COST_BUDGET_MICROS_GUEST: ${AI_DAILY_COST_BUDGET_MICROS_GUEST:-0}
  AI_DAILY_COST_BUDGET_MICROS_USER: ${AI_DAILY_COST_BUDGET_MICROS_USER:-0}
  AI_STREAM_CONCURRENCY_IP: ${AI_STREAM_CONCURRENCY_IP:-5}
  AI_STREAM_CONCURRENCY_GUEST: ${AI_STREAM_CONCURRENCY_GUEST:-1}
  AI_STREAM_CONCURRENCY_USER: ${AI_STREAM_CONCURRENCY_USER:-2}
  AI_STREAM_LOCK_TIMEOUT_SECONDS: ${AI_STREAM_LOCK_TIMEOUT_SECONDS:-180}
  AI_SESSION_LOCK_TIMEOUT_SECONDS: ${AI_SESSION_LOCK_TIMEOUT_SECONDS:-180}
  AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-45}
  AI_REQUEST_LOCK_TIMEOUT_SECONDS: ${AI_REQUEST_LOCK_TIMEOUT_SECONDS:-30}
  AI_REQUEST_STALE_SECONDS: ${AI_REQUEST_STALE_SECONDS:-180}
  AI_QUOTA_LOCK_TIMEOUT_SECONDS: ${AI_QUOTA_LOCK_TIMEOUT_SECONDS:-5}
  AI_QUOTA_LOCK_RETRY_AFTER_SECONDS: ${AI_QUOTA_LOCK_RETRY_AFTER_SECONDS:-1}
  AI_STREAM_HEARTBEAT_SECONDS: ${AI_STREAM_HEARTBEAT_SECONDS:-5}
  AI_ABUSE_BLOCK_THRESHOLD: ${AI_ABUSE_BLOCK_THRESHOLD:-8}
  AI_ABUSE_BLOCK_SECONDS: ${AI_ABUSE_BLOCK_SECONDS:-600}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
  WAIT_FOR_DATABASE: ${WAIT_FOR_DATABASE:-True}
  DATABASE_WAIT_MAX_RETRIES: ${DATABASE_WAIT_MAX_RETRIES:-30}
  DATABASE_WAIT_RETRY_SECONDS: ${DATABASE_WAIT_RETRY_SECONDS:-1}

x-app-service: &app-service
  <<: *service-defaults
  image: ${APP_IMAGE:-resto-web:local}
  build:
    context: .
    args:
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
  environment: *app-environment
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  db:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    cpus: ${DB_CPUS:-1.0}
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required} -d ${DB_NAME:?DB_NAME is required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --save
      - "60"
      - "10000"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  release:
    <<: *app-service
    profiles:
      - release
    restart: "no"
    command: ["/app/ops/release.sh"]
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-service
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    expose:
      - "8000"
    cpus: ${WEB_CPUS:-1.0}
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    pids_limit: 512
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          req = urllib.request.Request(
              "http://127.0.0.1:8000/health/live/",
              headers={"Host": os.environ.get("DJANGO_HEALTHCHECK_HOST", "127.0.0.1")},
          );
          urllib.request.urlopen(req, timeout=5).read()
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    <<: *service-defaults
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    profiles:
      - tls
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    cpus: ${NGINX_CPUS:-0.5}
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/health/ready/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
