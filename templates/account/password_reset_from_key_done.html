{% extends "base.html" %}
{% load static %}

{% block title %}Password Changed - RESTO AI{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
  <section class="auth-page" aria-labelledby="password-reset-complete-title">
    <div class="auth-card">
      <p class="auth-kicker">Password</p>
      <h1 id="password-reset-complete-title">Password changed</h1>
      <p class="auth-copy">Your password has been updated. You can now login with the new password.</p>

      <div class="auth-links">
        <a href="{% url 'account_login' %}">Login</a>
      </div>
    </div>
  </section>
{% endblock %}
