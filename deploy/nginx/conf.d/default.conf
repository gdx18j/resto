map $request_method $rate_limit_post_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $rate_limit_post_key zone=auth_post:10m rate=10r/m;
limit_req_zone $rate_limit_post_key zone=ai_post:10m rate=30r/m;
limit_req_zone $rate_limit_post_key zone=order_quote_post:10m rate=120r/m;
limit_req_zone $rate_limit_post_key zone=order_create_post:10m rate=20r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;

    location /healthz/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:resto_ssl:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
    }

    location ~ ^/accounts/(login|signup|password/reset|google/login)/$ {
        limit_req zone=auth_post burst=10 nodelay;
        proxy_pass http://web:8000;
    }

    location ~ ^/accounts/password/reset/key/ {
        limit_req zone=auth_post burst=10 nodelay;
        proxy_pass http://web:8000;
    }

    location = /ai/ask/ {
        limit_req zone=ai_post burst=10 nodelay;
        proxy_pass http://web:8000;
    }

    location = /orders/quote/ {
        limit_req zone=order_quote_post burst=30 nodelay;
        proxy_pass http://web:8000;
    }

    location = /orders/create/ {
        limit_req zone=order_create_post burst=10 nodelay;
        proxy_pass http://web:8000;
    }

    location / {
        proxy_pass http://web:8000;
    }
}
