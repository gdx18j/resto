map $request_uri $resto_safe_request_uri {
    ~^/t/ /t/[redacted]/;
    ~^/table/ /table/[redacted]/;
    default $request_uri;
}

map $http_referer $resto_safe_referer {
    ~^https?://[^/]+/(t|table)/ [redacted];
    default $http_referer;
}

log_format resto_main '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $resto_safe_request_uri $server_protocol" '
                      '$status $body_bytes_sent "$resto_safe_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

access_log /var/log/nginx/access.log resto_main;

map $request_method $rate_limit_post_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $rate_limit_post_key zone=auth_post:10m rate=10r/m;
limit_req_zone $rate_limit_post_key zone=ai_post:10m rate=30r/m;
limit_req_zone $rate_limit_post_key zone=order_quote_post:10m rate=120r/m;
limit_req_zone $rate_limit_post_key zone=order_create_post:10m rate=20r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;

    location = /health/live/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health/ready/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:resto_ssl:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_redirect off;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
    }

    location = /health/live/ {
        proxy_pass http://web:8000;
    }

    location = /health/ready/ {
        proxy_pass http://web:8000;
    }

    location = /healthz/ {
        proxy_pass http://web:8000;
    }

    location ~ ^/accounts/(login|signup|password/reset|google/login)/$ {
        limit_req zone=auth_post burst=10 nodelay;
        client_max_body_size 128k;
        proxy_pass http://web:8000;
    }

    location ~ ^/accounts/password/reset/key/ {
        limit_req zone=auth_post burst=10 nodelay;
        client_max_body_size 128k;
        proxy_pass http://web:8000;
    }

    location = /ai/ask/ {
        limit_req zone=ai_post burst=10 nodelay;
        client_max_body_size 256k;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        add_header X-Accel-Buffering no always;
        proxy_pass http://web:8000;
    }

    location = /orders/quote/ {
        limit_req zone=order_quote_post burst=30 nodelay;
        client_max_body_size 256k;
        proxy_pass http://web:8000;
    }

    location = /orders/create/ {
        limit_req zone=order_create_post burst=10 nodelay;
        client_max_body_size 256k;
        proxy_pass http://web:8000;
    }

    location / {
        proxy_pass http://web:8000;
    }
}
