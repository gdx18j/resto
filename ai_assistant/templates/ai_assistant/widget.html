<section
  class="ai-assistant"
  data-ai-assistant
  data-endpoint="{% url 'ai_assistant:ask' %}"
  data-history-endpoint="{% url 'ai_assistant:history' %}"
  data-account-bound="{% if request.user.is_authenticated %}1{% else %}0{% endif %}"
  data-storage-key="resto.aiAssistant.v3"
  aria-label="{% if ui_language == 'en' %}AI assistant{% elif ui_language == 'tr' %}AI asistanı{% else %}ИИ-ассистент{% endif %}"
  data-i18n-aria-label
  data-aria-label-ru="ИИ-ассистент"
  data-aria-label-en="AI assistant"
  data-aria-label-tr="AI asistanı"
>
  <div class="ai-assistant__backdrop" data-ai-backdrop aria-hidden="true"></div>

  <button
    class="ai-assistant__launcher"
    type="button"
    data-ai-open
    aria-expanded="false"
    aria-controls="ai-assistant-panel"
    title="{% if ui_language == 'en' %}Open AI assistant{% elif ui_language == 'tr' %}AI asistanını aç{% else %}Открыть ИИ-ассистента{% endif %}"
    aria-label="{% if ui_language == 'en' %}Open AI assistant{% elif ui_language == 'tr' %}AI asistanını aç{% else %}Открыть ИИ-ассистента{% endif %}"
    data-i18n-title
    data-i18n-aria-label
    data-title-ru="Открыть ИИ-ассистента"
    data-title-en="Open AI assistant"
    data-title-tr="AI asistanını aç"
    data-aria-label-ru="Открыть ИИ-ассистента"
    data-aria-label-en="Open AI assistant"
    data-aria-label-tr="AI asistanını aç"
  >
    <svg aria-hidden="true"><use href="#i-sparkles"/></svg>
    <span class="ai-assistant__launcher-text">AI</span>
  </button>

  <div
    class="ai-assistant__panel"
    id="ai-assistant-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ai-assistant-title"
    data-ai-panel
    hidden
  >
    <header class="ai-assistant__header">
      <div>
        <p class="ai-assistant__kicker">Gemini</p>
        <h2 id="ai-assistant-title">
          <span class="lang lang--ru">ИИ-ассистент</span>
          <span class="lang lang--en">AI assistant</span>
          <span class="lang lang--tr">AI asistanı</span>
        </h2>
      </div>

      <div class="ai-assistant__header-actions">
        <button
          class="ai-assistant__ghost-button"
          type="button"
          data-ai-reset
        >
          <span class="lang lang--ru">Новый чат</span>
          <span class="lang lang--en">New chat</span>
          <span class="lang lang--tr">Yeni sohbet</span>
        </button>
        <button
          class="ai-assistant__icon-button"
          type="button"
          data-ai-close
          aria-label="{% if ui_language == 'en' %}Close chat{% elif ui_language == 'tr' %}Sohbeti kapat{% else %}Свернуть чат{% endif %}"
          data-i18n-aria-label
          data-aria-label-ru="Свернуть чат"
          data-aria-label-en="Close chat"
          data-aria-label-tr="Sohbeti kapat"
        >
          <svg aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>

    <div class="ai-assistant__messages" data-ai-messages aria-live="polite"></div>

    <form class="ai-assistant__form" data-ai-form>
      {% csrf_token %}
      <label class="ai-assistant__input-wrap">
        <span class="ai-assistant__sr-only">
          <span class="lang lang--ru">Ваш вопрос</span>
          <span class="lang lang--en">Your question</span>
          <span class="lang lang--tr">Sorunuz</span>
        </span>
        <textarea
          class="lang-input lang-input--ru"
          id="ai-assistant-input-ru"
          name="prompt"
          rows="2"
          maxlength="4000"
          data-ai-input
          placeholder="Спросите про меню, аллергены или попросите подобрать блюдо"
        ></textarea>
        <textarea
          class="lang-input lang-input--en"
          id="ai-assistant-input-en"
          name="prompt"
          rows="2"
          maxlength="4000"
          data-ai-input
          placeholder="Ask about the menu, allergens, or request a dish recommendation"
        ></textarea>
        <textarea
          class="lang-input lang-input--tr"
          id="ai-assistant-input-tr"
          name="prompt"
          rows="2"
          maxlength="4000"
          data-ai-input
          placeholder="Menü, alerjenler hakkında sorun veya yemek önerisi isteyin"
        ></textarea>
      </label>

      <button
        class="ai-assistant__send"
        type="submit"
        data-ai-send
        aria-label="{% if ui_language == 'en' %}Send message{% elif ui_language == 'tr' %}Mesaj gönder{% else %}Отправить сообщение{% endif %}"
        data-i18n-aria-label
        data-aria-label-ru="Отправить сообщение"
        data-aria-label-en="Send message"
        data-aria-label-tr="Mesaj gönder"
      >
        <svg aria-hidden="true"><use href="#i-send"/></svg>
      </button>
    </form>
  </div>
</section>
