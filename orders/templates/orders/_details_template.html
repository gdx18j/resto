<template data-order-details-template="{{ order.id }}">
  <div class="order-modal__head">
    <div>
      <span class="order-modal__kicker">
        <span class="lang lang--ru">Детали заказа</span>
        <span class="lang lang--en">Order details</span>
        <span class="lang lang--tr">Sipariş detayları</span>
      </span>
      <strong class="order-modal__id">
        <span class="lang lang--ru">Заказ №{{ order.id }}</span>
        <span class="lang lang--en">Order #{{ order.id }}</span>
        <span class="lang lang--tr">Sipariş #{{ order.id }}</span>
      </strong>
    </div>
    <span class="order-history-status order-history-status--{{ order.status }}">
      {{ order.status_label }}
    </span>
  </div>

  <div
    class="order-progress"
    aria-label="{% if ui_language == 'en' %}Order status{% elif ui_language == 'tr' %}Sipariş durumu{% else %}Статус заказа{% endif %}"
    data-i18n-aria-label
    data-aria-label-ru="Статус заказа"
    data-aria-label-en="Order status"
    data-aria-label-tr="Sipariş durumu"
  >
    {% for step in order.status_steps %}
      <span class="order-progress__step order-progress__step--{{ step.state }}">
        <span class="order-progress__dot"></span>
        <span>{{ step.label }}</span>
      </span>
    {% endfor %}
  </div>

  <div class="order-facts">
    <span>{{ order.created_at|date:"d.m.Y" }} · {{ order.created_at|date:"H:i" }}</span>
    <span>{{ order.display_restaurant_name }}</span>
    <span>{% include "orders/_order_mode_label.html" with order=order %}</span>
    {% if order.display_table_number %}
      <span>
        <span class="lang lang--ru">Стол {{ order.display_table_number }}</span>
        <span class="lang lang--en">Table {{ order.display_table_number }}</span>
        <span class="lang lang--tr">Masa {{ order.display_table_number }}</span>
      </span>
    {% endif %}
    <span>
      {{ order.guests_count }}
      <span class="lang lang--ru">перс.</span>
      <span class="lang lang--en">guests</span>
      <span class="lang lang--tr">kişi</span>
    </span>
    {% if order.primary_payment %}<span>{{ order.primary_payment.get_method_display }}</span>{% endif %}
  </div>

  <div class="order-receipt">
    {% for item in order.items.all %}
      <div class="order-receipt__row">
        <span class="order-receipt__thumb" aria-hidden="true">
          {% if item.dish.image %}
            <img src="{{ item.dish.image.url }}" alt="">
          {% else %}
            <span>{{ item.dish_name|first }}</span>
          {% endif %}
        </span>
        <span class="order-receipt__name">{{ item.dish_name }}</span>
        <span class="order-receipt__qty">× {{ item.quantity }}</span>
        <strong>{{ item.line_total }} ₽</strong>
      </div>
    {% endfor %}
  </div>

  {% if order.comment %}
    <div class="order-note">
      <span class="order-note__label">
        <span class="lang lang--ru">Комментарий</span>
        <span class="lang lang--en">Comment</span>
        <span class="lang lang--tr">Not</span>
      </span>
      <p>{{ order.comment }}</p>
    </div>
  {% endif %}

  <div class="order-modal__total">
    <span>
      <span class="lang lang--ru">Итого</span>
      <span class="lang lang--en">Total</span>
      <span class="lang lang--tr">Toplam</span>
    </span>
    <strong>{{ order.total_amount }} ₽</strong>
  </div>

  {% if order.can_repeat_in_table_context %}
    <button
      type="button"
      class="primary-button order-modal__repeat"
      data-repeat-order
      data-repeat-restaurant-slug="{{ order.restaurant_slug_snapshot }}"
      data-repeat-order-mode="{{ order.order_mode }}"
      data-repeat-table-number="{{ order.table_number_snapshot }}"
      data-repeat-guests-count="{{ order.guests_count }}"
      data-items="{{ order.repeat_available_items_json }}"
      data-repeat-result="{{ order.repeat_result_json }}"
    >
      <span class="lang lang--ru">Повторить заказ</span>
      <span class="lang lang--en">Repeat order</span>
      <span class="lang lang--tr">Siparişi tekrarla</span>
    </button>
  {% endif %}
</template>
